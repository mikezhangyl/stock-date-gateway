[project]
name = "stock-data-gateway"
version = "0.1.0"
description = "Local market data gateway with provider-neutral cache, Tushare facade, and offline validation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
provider = [
  "akshare>=1.16,<2.0",
  "pandas>=1.5,<3.0",
  "tushare>=1.4,<2.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
market-gateway-validate = "stock_data_gateway.cli.validate:main"
market-gateway-backfill = "stock_data_gateway.cli.backfill:main"
market-gateway-cache = "stock_data_gateway.cli.cache:main"
market-gateway-fni-acceptance = "stock_data_gateway.cli.fni_acceptance:main"
market-gateway-narrative-source-acceptance = "stock_data_gateway.cli.narrative_source_acceptance:main"
market-gateway-narrative-source-capabilities = "stock_data_gateway.cli.narrative_source_capabilities:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stock_data_gateway"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=stock_data_gateway --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["stock_data_gateway"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["UP006", "UP007", "UP037", "UP045"]
